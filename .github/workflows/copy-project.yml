name: Copy EVO Hybrid Club

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/copy-project.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: target
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: manupaescaoch/evo-hybrid-club
          ref: main
          path: source

      - name: Copy project
        run: |
          rsync -a --delete \
            --exclude=".git" \
            --exclude=".env" \
            --exclude=".github/workflows/copy-project.yml" \
            source/ target/

      - name: Commit copied project
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Copy EVO Hybrid Club project"
            git push origin main
          fi
